title: CardIQ
description: Guess the real market price of trading cards. A new Daily Challenge every midnight, nine ways to play, rooms for your friends and a Market IQ that measures your eye.
url: https://playcardiq.com
markdown: kramdown

# At launch, set this to the App Store ID (6816035368). Every "Coming soon to
# iPhone" button then becomes the App Store badge, and Safari shows its Smart
# App Banner.
app_store_id:

defaults:
  - scope:
      path: ""
    values:
      layout: default
# Jekyll skips dot-folders; iOS reads universal link settings from .well-known.
include:
  - .well-known
exclude:
  - README.md
  - scripts
