# Keeps the landing page's ticker, demo cards and stats in step with the app's
# card pool. Runs an hour after the app's nightly ingest (03:30 UTC).
name: Refresh landing page prices

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/showcase.mjs
      - name: Commit and rebuild the site if prices changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/showcase.json; then
            echo "Prices unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/showcase.json
          git commit -m 'Refresh landing page prices'
          git push
          # Pushes made with the workflow token don't always start a Pages build.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
