<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@900&family=JetBrains+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;700&display=swap">
<style>
  :root {
    --ink: #0A0C0B;
    --panel: #121614;
    --rule: #252B27;
    --paper: #ECF2EC;
    --muted: #8E9A91;
    --lime: #C6F432;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font: 500 17px/1.6 'Instrument Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header { border-bottom: 1px solid var(--rule); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; flex-wrap: wrap; }
  .wordmark {
    display: inline-flex; align-items: center; gap: 6px;
    font: 900 34px/1 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif;
    color: var(--paper); text-decoration: none; text-transform: uppercase;
  }
  .wordmark .iq { background: var(--lime); color: var(--ink); padding: 3px 6px 2px; border-radius: 5px; }
  nav { display: flex; gap: 18px; font: 700 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
  nav a { color: var(--muted); text-decoration: none; padding: 8px 0; }
  nav a:hover, nav a[aria-current="page"] { color: var(--lime); }
  main { padding: 40px 0 64px; }
  h1, h2 { font-family: 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif; font-weight: 900; text-transform: uppercase; line-height: .95; margin: 0; }
  h1 { font-size: clamp(48px, 10vw, 72px); margin-bottom: 12px; }
  h2 { font-size: 30px; margin: 40px 0 12px; padding-top: 24px; border-top: 1px solid var(--rule); }
  p, li { color: #B9C4BC; }
  strong { color: var(--paper); }
  a { color: var(--lime); }
  .kicker { font: 700 12px/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); margin: 0 0 12px; }
  .lede { font-size: 19px; color: var(--paper); }
  code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: .9em; }
  footer { border-top: 1px solid var(--rule); padding: 28px 0 48px; font-size: 13px; }
  footer p { color: var(--muted); margin: 0 0 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="CardIQ home">Card<span class="iq">IQ</span></a>
    <nav aria-label="Site">
      <a href="{{ '/privacy' | relative_url }}"{% if page.url == '/privacy.html' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms' | relative_url }}"{% if page.url == '/terms.html' %} aria-current="page"{% endif %}>Terms</a>
      <a href="{{ '/support' | relative_url }}"{% if page.url == '/support.html' %} aria-current="page"{% endif %}>Support</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>
<footer>
  <div class="wrap">
    <p>© 2026 Charlie Horton. CardIQ is an independent game.</p>
    <p>CardIQ is not affiliated with, endorsed or sponsored by Nintendo, The Pokémon Company, Creatures or GAME FREAK. Pokémon and card images are trademarks and copyright of their respective owners.</p>
  </div>
</footer>
</body>
</html>
